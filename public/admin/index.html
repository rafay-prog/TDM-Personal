    <!--
      Sveltia CMS: a drop-in replacement for Decap CMS that reads the same
      config.yml. Pinned to a major version so the admin cannot change shape
      under you without an edit here.

      It commits to GitHub and Vercel builds from that commit, so publishing a
      post is a normal deploy — no server, no database, and every change is an
      ordinary commit that can be reviewed or reverted.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js" type="module"></script>
