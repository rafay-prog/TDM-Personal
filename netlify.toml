# Netlify build config for the static export.
#
# The 301s from the old WordPress URLs live in public/_redirects (generated from
# deploy/vercel.json) and are copied into out/ by the build.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Hashed build assets never change under the same URL — cache them hard.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hashed by scripts/hash-assets.mjs, so immutable is truthful here.
[[headers]]
  for = "/sectors/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/why/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/services/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/partners/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Plain filenames — must revalidate so a replacement is picked up.
[[headers]]
  for = "/clients/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# HTML must revalidate so content edits go live on the next request.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
